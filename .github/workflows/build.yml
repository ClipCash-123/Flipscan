name: Build FlipScan Mac App
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate app
        run: npm run check
      - name: Build Mac installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - name: Verify installer
        run: |
          ls -lah dist
          find dist -maxdepth 1 -name "*.dmg" -print -quit | grep .
          find dist -maxdepth 1 -name "*.zip" -print -quit | grep .
      - name: Upload FlipScan Mac app
        uses: actions/upload-artifact@v4
        with:
          name: FlipScan-Mac-v0.6
          path: |
            dist/*.dmg
            dist/*.zip
