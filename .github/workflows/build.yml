name: FlipScan Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - name: Verify files
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
